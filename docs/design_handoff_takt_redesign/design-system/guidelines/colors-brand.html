<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:var(--font-sans)}.sw{display:grid;gap:10px}.s{display:flex;flex-direction:column;gap:6px}.s i{display:block;height:64px;border-radius:12px}.s b{font-size:13px}.s small{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}.m{color:var(--text-muted);font-size:12px}</style></head><body><div class="sw" style="grid-template-columns:repeat(7,1fr)"><div class="s"><i style="background:var(--pink);"></i><b>Rosé</b><small>--pink</small></div><div class="s"><i style="background:var(--pink-light);"></i><b>pink-light</b><small>--pink-light</small></div><div class="s"><i style="background:var(--pink-deep);"></i><b>pink-deep</b><small>--pink-deep</small></div><div class="s"><i style="background:var(--lila);"></i><b>Lavendel</b><small>--lila</small></div><div class="s"><i style="background:var(--salbei);"></i><b>Salbei</b><small>--salbei · primary</small></div><div class="s"><i style="background:var(--rose-50);"></i><b>text</b><small>--rose-50</small></div><div class="s"><i style="background:var(--rose-300);"></i><b>text-muted</b><small>--rose-300</small></div></div></body></html>
