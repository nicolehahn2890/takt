<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:var(--font-sans)}
h3{font-family:var(--font-display);font-size:24px;font-weight:600;letter-spacing:-.3px;margin:0}
.h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;max-width:380px}.h span,.m{font-size:13px;color:var(--text-muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;max-width:380px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.bdg i{width:64px;height:64px;border-radius:50%;background:var(--surface-ghost);display:flex;align-items:center;justify-content:center}
.bdg i b{width:56px;height:56px;border-radius:50%;background:var(--surface-sunken);color:var(--text-muted);display:flex;align-items:center;justify-content:center}
.bdg svg{width:28px;height:28px}
.bdg.on i{background:var(--bc)}.bdg.on i b{background:transparent;color:var(--text-on-accent)}
.bdg.prog i{background:conic-gradient(var(--bc) 0 var(--p),var(--surface-ghost-strong) var(--p) 100%)}
.bdg span{font-size:12px;line-height:1.3;text-align:center;color:var(--text-muted)}.bdg.on span{color:var(--text)}
.bdg em{font-style:normal;font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums;margin-top:-3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:20px 0 0;max-width:380px}.legend small{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted)}.legend i{width:10px;height:10px;border-radius:50%}
</style>
<script src="../assets/badges/badges.js"></script><script src="../assets/badges/badge-icons.js"></script></head>
<body><div class="h"><h3>Abzeichen</h3><span id="count"></span></div><div class="grid" id="grid"></div>
<div class="legend"><small><i style="background:#C6C5A6"></i>Trainings</small><small><i style="background:#C4A882"></i>Minuten</small><small><i style="background:#BE7B9D"></i>Serie</small><small><i style="background:#B794C5"></i>Tageszeit</small><small><i style="background:#A8C4A0"></i>Abwechslung</small><small><i style="background:#8AB4C4"></i>Entdecken</small></div>
<p class="m" style="max-width:380px;line-height:1.5">Erreicht = gefüllt in der Gruppenfarbe. Gesperrt = grau, bei Zählzielen mit Fortschrittsring und „x von y“. Icons: Tabler Icons (MIT), nur bei Abzeichen.</p>
<script>(function(T){
var earned={first:1,ten:1,min100:1,streak3:1,early:1,themes:1,own:1};
var prog={t25:[14,25],t50:[14,50],t100:[14,100],min500:[310,500],min1000:[310,1000],streak7:[4,7],streak14:[4,14],streak30:[4,30],mix5:[2,5],breath10:[7,10],tpl12:[5,12],ownex5:[1,5],notes10:[3,10]};
var fmt=function(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.')};
var n=0,html=T.BADGES.map(function(b){var on=!!earned[b.id];if(on)n++;var p=prog[b.id];var ring=!on&&p&&p[1]>1;var pct=ring?Math.round(p[0]/p[1]*100):0;
return '<div class="bdg'+(on?' on':'')+(ring?' prog':'')+'" style="--bc:'+b.color+';--p:'+pct+'%"><i><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+T.BADGE_ICONS[b.icon]+'</svg></b></i><span>'+b.title+'</span>'+(ring?'<em>'+fmt(p[0])+' von '+fmt(p[1])+'</em>':'')+'</div>'}).join('');
document.getElementById('grid').innerHTML=html;document.getElementById('count').textContent=n+' von '+T.BADGES.length;
})(window.Takt)</script></body></html>
