<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:var(--font-sans)}.sw{display:grid;gap:10px}.s{display:flex;flex-direction:column;gap:6px}.s i{display:block;height:64px;border-radius:12px}.s b{font-size:13px}.s small{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}.m{color:var(--text-muted);font-size:12px}</style></head><body><div class="sw" style="grid-template-columns:repeat(5,1fr)"><div class="s"><i style="background:var(--figure-near);"></i><b>figure-near</b><small>--figure-near</small></div><div class="s"><i style="background:var(--figure-far);"></i><b>figure-far</b><small>--figure-far</small></div><div class="s"><i style="background:var(--figure-head);"></i><b>figure-head</b><small>--figure-head</small></div><div class="s"><i style="background:var(--plum-600);"></i><b>prop</b><small>--plum-600</small></div><div class="s"><i style="background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px var(--line-strong)"></i><b>mat</b><small>rgba(255,255,255,.07</small></div></div></body></html>
