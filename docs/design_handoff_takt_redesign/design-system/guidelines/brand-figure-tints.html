<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:var(--font-sans)}.sw{display:grid;gap:10px}.s{display:flex;flex-direction:column;gap:6px}.s i{display:block;height:64px;border-radius:12px}.s b{font-size:13px}.s small{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}.m{color:var(--text-muted);font-size:12px}</style><script src="../assets/figure/exercises.js"></script><script src="../assets/figure/poses.js"></script><script src="../assets/figure/figure.js"></script></head><body><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px"><div><svg data-fig="katze-kuh" style="width:100%;aspect-ratio:216/160;background:color-mix(in oklab,var(--theme-core) 13%,var(--plum-850));border-radius:10px;display:block"></svg><small class="m" style="display:flex;gap:6px;align-items:center;margin-top:6px"><i style="width:8px;height:8px;border-radius:50%;background:var(--theme-core)"></i>core</small></div><div><svg data-fig="crunch" style="width:100%;aspect-ratio:216/160;background:color-mix(in oklab,var(--theme-bauch) 13%,var(--plum-850));border-radius:10px;display:block"></svg><small class="m" style="display:flex;gap:6px;align-items:center;margin-top:6px"><i style="width:8px;height:8px;border-radius:50%;background:var(--theme-bauch)"></i>bauch</small></div><div><svg data-fig="taube" style="width:100%;aspect-ratio:216/160;background:color-mix(in oklab,var(--theme-dehnen) 13%,var(--plum-850));border-radius:10px;display:block"></svg><small class="m" style="display:flex;gap:6px;align-items:center;margin-top:6px"><i style="width:8px;height:8px;border-radius:50%;background:var(--theme-dehnen)"></i>dehnen</small></div><div><svg data-fig="krieger-2" style="width:100%;aspect-ratio:216/160;background:color-mix(in oklab,var(--theme-yoga) 13%,var(--plum-850));border-radius:10px;display:block"></svg><small class="m" style="display:flex;gap:6px;align-items:center;margin-top:6px"><i style="width:8px;height:8px;border-radius:50%;background:var(--theme-yoga)"></i>yoga</small></div><div><svg data-fig="kniebeuge" style="width:100%;aspect-ratio:216/160;background:color-mix(in oklab,var(--theme-beine) 13%,var(--plum-850));border-radius:10px;display:block"></svg><small class="m" style="display:flex;gap:6px;align-items:center;margin-top:6px"><i style="width:8px;height:8px;border-radius:50%;background:var(--theme-beine)"></i>beine</small></div><div><svg data-fig="superman" style="width:100%;aspect-ratio:216/160;background:color-mix(in oklab,var(--theme-ruecken) 13%,var(--plum-850));border-radius:10px;display:block"></svg><small class="m" style="display:flex;gap:6px;align-items:center;margin-top:6px"><i style="width:8px;height:8px;border-radius:50%;background:var(--theme-ruecken)"></i>ruecken</small></div></div><script>(function(T){function pose(id){var e=(T.EXERCISES||[]).find(function(x){return x.id===id});if(e&&e.typ==='atem'&&e.atem)return{breath:e.atem};return(T.POSES||{})[id]||T.POSE_DEFAULT}document.querySelectorAll('svg[data-fig]').forEach(function(s){T.figure.still(s,pose(s.getAttribute('data-fig')))})})(window.Takt)</script></body></html>
