<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:var(--font-sans)}.sw{display:grid;gap:10px}.s{display:flex;flex-direction:column;gap:6px}.s i{display:block;height:64px;border-radius:12px}.s b{font-size:13px}.s small{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}.m{color:var(--text-muted);font-size:12px}</style></head><body><div class="sw" style="grid-template-columns:repeat(6,1fr)"><div class="s"><i style="background:var(--danger);"></i><b>danger</b><small>--danger</small></div><div class="s"><i style="background:var(--danger-surface);box-shadow:inset 0 0 0 1px var(--line-strong)"></i><b>danger-surface</b><small>--danger-surface</small></div><div class="s"><i style="background:var(--warning);"></i><b>warning</b><small>--warning</small></div><div class="s"><i style="background:var(--tint-lila);box-shadow:inset 0 0 0 1px var(--line-strong)"></i><b>tint-lila</b><small>--tint-lila</small></div><div class="s"><i style="background:var(--tint-pink);box-shadow:inset 0 0 0 1px var(--line-strong)"></i><b>tint-pink</b><small>--tint-pink</small></div><div class="s"><i style="background:var(--scrim);box-shadow:inset 0 0 0 1px var(--line-strong)"></i><b>scrim</b><small>--scrim</small></div></div></body></html>
