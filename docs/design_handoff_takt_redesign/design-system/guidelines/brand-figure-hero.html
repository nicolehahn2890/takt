<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:var(--font-sans)}.sw{display:grid;gap:10px}.s{display:flex;flex-direction:column;gap:6px}.s i{display:block;height:64px;border-radius:12px}.s b{font-size:13px}.s small{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}.m{color:var(--text-muted);font-size:12px}</style><script src="../assets/figure/exercises.js"></script><script src="../assets/figure/poses.js"></script><script src="../assets/figure/figure.js"></script></head><body><div style="display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:center"><svg data-fig="dead-bug" style="width:100%;aspect-ratio:216/160;background:var(--surface-sunken);border-radius:20px;display:block"></svg><div><div style="font-size:24px;font-weight:700">Dead Bug</div><p style="color:var(--text-muted);font-size:14px;line-height:1.45;margin:8px 0 0">Animates between key frames (hold .6 s · move .9 s, smoothstep). Hold poses breathe softly at the shoulders. Breathing exercises become a growing lila circle.</p></div></div><script>(function(T){function pose(id){var e=(T.EXERCISES||[]).find(function(x){return x.id===id});if(e&&e.typ==='atem'&&e.atem)return{breath:e.atem};return(T.POSES||{})[id]||T.POSE_DEFAULT}document.querySelectorAll('svg[data-fig]').forEach(function(s){T.figure.mount(s,pose(s.getAttribute('data-fig')))})})(window.Takt)</script></body></html>
