-fig="seitstuetz" style="width:100%;aspect-ratio:216/160;background:var(--surface-sunken);border-radius:10px;display:block"></svg><svg data-fig="kindhaltung" style="width:100%;aspect-ratio:216/160;background:var(--surface-sunken);border-radius:10px;display:block"></svg></div><script>(function(T){function pose(id){var e=(T.EXERCISES||[]).find(function(x){return x.id===id});if(e&&e.typ==='atem'&&e.atem)return{breath:e.atem};return(T.POSES||{})[id]||T.POSE_DEFAULT}document.querySelectorAll('svg[data-fig]').forEach(function(s){T.figure.mount(s,pose(s.getAttribute('data-fig')))})})(window.Takt)</script></body></html>
