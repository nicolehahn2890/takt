<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:var(--font-sans)}.sw{display:grid;gap:10px}.s{display:flex;flex-direction:column;gap:6px}.s i{display:block;height:64px;border-radius:12px}.s b{font-size:13px}.s small{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}.m{color:var(--text-muted);font-size:12px}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"><div style="height:120px;border-radius:14px;background:var(--bg-page);background-size:auto"></div><div style="height:120px;border-radius:14px;background:var(--bg-training)"></div><div style="height:120px;border-radius:14px;background:var(--plum-900);display:grid;place-items:center"><span style="background:var(--text);color:var(--plum-900);padding:8px 12px;border-radius:12px;font-size:13px;box-shadow:var(--shadow-toast)">Gespeichert</span></div><div style="height:120px;border-radius:14px;background:var(--scrim);position:relative;overflow:hidden"><i style="position:absolute;left:0;right:0;bottom:0;height:60px;background:var(--surface-sheet);border-radius:18px 18px 0 0;box-shadow:var(--shadow-sheet)"></i></div></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:6px" class="m"><span>page glow 160°</span><span>training glow</span><span>toast shadow</span><span>sheet on scrim</span></div></body></html>
