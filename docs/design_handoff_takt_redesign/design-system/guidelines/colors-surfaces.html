<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:var(--font-sans)}.sw{display:grid;gap:10px}.s{display:flex;flex-direction:column;gap:6px}.s i{display:block;height:64px;border-radius:12px}.s b{font-size:13px}.s small{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}.m{color:var(--text-muted);font-size:12px}</style></head><body><div class="sw" style="grid-template-columns:repeat(7,1fr)"><div class="s"><i style="background:var(--plum-900);box-shadow:inset 0 0 0 1px var(--line-strong)"></i><b>Background</b><small>--plum-900</small></div><div class="s"><i style="background:var(--plum-650);"></i><b>bg-glow</b><small>--plum-650</small></div><div class="s"><i style="background:var(--plum-850);box-shadow:inset 0 0 0 1px var(--line-strong)"></i><b>surface-sunken</b><small>--plum-850</small></div><div class="s"><i style="background:var(--plum-750);"></i><b>Surface</b><small>--plum-750</small></div><div class="s"><i style="background:var(--plum-800);"></i><b>surface-sheet</b><small>--plum-800</small></div><div class="s"><i style="background:var(--plum-700);"></i><b>Elevated</b><small>--plum-700</small></div><div class="s"><i style="background:var(--surface-ghost);box-shadow:inset 0 0 0 1px var(--line-strong)"></i><b>ghost</b><small>--surface-ghost</small></div></div></body></html>
